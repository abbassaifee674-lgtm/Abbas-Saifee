[build]
  command = "npm run build"

# Use the official Next.js plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify Scheduled Function – runs twice daily at 08:00 and 18:00 UTC
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Environment hints
[context.production.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

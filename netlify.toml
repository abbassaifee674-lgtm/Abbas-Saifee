[build]
  command = "npm run build"

# Use the official Next.js plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify Scheduled Function – runs twice daily at 08:00 and 18:00 UTC
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Ensure all dependencies are installed for the build
[build.environment]
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"

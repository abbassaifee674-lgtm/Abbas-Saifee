services:
  - type: web
    name: abbas-procurehunter
    env: python
    buildCommand: pip install -r requirements.txt && python generate_cv_pdf.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
